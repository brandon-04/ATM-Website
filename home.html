<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title></title>
</head>
<body>
    <div id="outerContainer">
        <div id="leftContainer">
            <div id="titleBox">
                <h1 id="title">TrostBanking</h1>
            </div>
            <div id="screenContainer"></div>
        </div>

        <div id="rightContainer">
            <div id="keypad">
                <div class="keypadRow">
                    <button class="keypadButtons" id="1">1</button>
                    <button class="keypadButtons" id="2">2</button>
                    <button class="keypadButtons" id="3">3</button>
                </div>
                <div class="keypadRow">
                    <button class="keypadButtons" id="4">4</button>
                    <button class="keypadButtons" id="5">5</button>
                    <button class="keypadButtons" id="6">6</button>
                </div>
                <div class="keypadRow">
                    <button class="keypadButtons" id="7">7</button>
                    <button class="keypadButtons" id="8">8</button>
                    <button class="keypadButtons" id="9">9</button>
                </div>
                <div class="keypadRow">
                    <button class="keypadButtons" id="no"></button>
                    <button class="keypadButtons" id="0">0</button>
                    <button class="keypadButtons" id="yes"></button>
                </div>
                
            </div>
            <div id="cardSlot"></div>
            <div id="cashSlot"></div>
        </div>
    </div>
</body>
</html>
