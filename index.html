<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Evergreen Banking</title>
</head>
<body>
    <div id="outerContainer">
        <div id="leftContainer">
            <div id="titleBox">
                <img src="img/icon/forest-outline.svg" id="logo">
                <h1 id="title">Evergreen Banking</h1>
            </div>

            <div id="screenContainer">
                <div id="topBox">
                    <p id="time"></p>
                    <p id="location"></p>
                    <p id="date"></p>
                </div>


                <div class="pinEntry" id="pinEntryScreen">
                    <h1 class="pinEntry">Please enter your PIN:</h1>
                    <div class="pinEntry">
                        <h1 class="pinEntry" id="pinEntryTextDisplay"></h1>
                    </div>
                </div>

                
                <div class="lockout hidden" id="lockOutScreen">
                    <h1 class="lockout hidden">No tries remaining :&#40;</h1>
                </div>


                <div class="home hidden" id="homeScreen">
                    <button class="home hidden" id="balanceButton">Balance</button>
                    <button class="home hidden" id="withdrawButton">Withdraw</button>
                    <button class="home hidden" id="pinChangeButton">Change Pin</button>
                </div>


                <div class="balance hidden" id="balanceScreen">
                    <h1 class="balance hidden">Current Balance:</h1>
                    <h1 class="balance hidden" id="balanceDisplayText"></h1>
                </div>


                <div class="withdraw hidden" id="withdrawScreen">
                    <h1 class="withdraw hidden">withdraw</h1>
                </div>

                <div class="pinChange hidden" id="pinChangeScreen">
                    <h1 class="pinChange hidden">pin change</h1>
                </div>

            </div>
        </div>

        <div id="rightContainer">
            <div id="keypad">
                <div class="keypadRow">
                    <button class="keypadButtons" id="button1">1</button>
                    <button class="keypadButtons" id="button2">2</button>
                    <button class="keypadButtons" id="button3">3</button>
                </div>

                <div class="keypadRow">
                    <button class="keypadButtons" id="button4">4</button>
                    <button class="keypadButtons" id="button5">5</button>
                    <button class="keypadButtons" id="button6">6</button>
                </div>

                <div class="keypadRow">
                    <button class="keypadButtons" id="button7">7</button>
                    <button class="keypadButtons" id="button8">8</button>
                    <button class="keypadButtons" id="button9">9</button>
                </div>

                <div class="keypadRow">
                    <button class="keypadButtons" id="buttonNo"><img id="noSymbol" src="img/icon/cross.svg"></button>
                    <button class="keypadButtons" id="button0">0</button>
                    <button class="keypadButtons" id="buttonYes"><img id="yesSymbol" src="img/icon/check.svg"></button>
                </div>
                <h1>Press X to go back</h1>
                
            </div>

            <div id="cardSlot"><p>card slot</p></div>

            <div id="cashSlot"><p>cash slot</p></div>
        </div>
    </div>
</body>
</html>
